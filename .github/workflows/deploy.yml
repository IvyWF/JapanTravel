name: Node.js CI and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - run: npm ci
    - run: npm run build
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@4.6.3
      with:
        branch: gh-pages
        folder: dist
